{
    "build_script": "../certora_build.py",
    "msg": "Enumerable Mint/Burn Integrity Rules",
    "rule": [
        "enumerable_sequential_mint_sets_owner",
        "enumerable_sequential_mint_increases_balance",
        "enumerable_sequential_mint_increases_total_supply",
        "enumerable_sequential_mint_sets_token_index",
        "enumerable_sequential_mint_token_index_is_total_supply_minus_one",
        "enumerable_sequential_mint_sets_owner_token_index",
        "enumerable_sequential_mint_owner_token_index_is_balance_minus_one",
        "enumerable_non_sequential_mint_sets_owner",
        "enumerable_non_sequential_mint_increases_balance",
        "enumerable_non_sequential_mint_increases_total_supply",
        "enumerable_non_sequential_mint_sets_token_index",
        "enumerable_non_sequential_mint_token_index_is_total_supply_minus_one",
        "enumerable_non_sequential_mint_sets_owner_token_index",
        "enumerable_non_sequential_mint_owner_token_index_is_balance_minus_one",
        "enumerable_burn_decreases_total_supply",
        "enumerable_burn_decreases_balance",
        "enumerable_burn_from_decreases_total_supply",
        "enumerable_burn_from_decreases_balance",
        "enumerable_burn_from_removes_approval"
    ],
    "rule_sanity": "advanced",
    "server": "production",
    "prover_version": "master",
    "global_timeout": "7200",
    "smt_timeout": "7200",
    "url_visibility": "public"
}
