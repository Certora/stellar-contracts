
{
    "build_script": "../certora_build.py",
    "loop_iter": 1,
    "msg": "Invariants Spending Limit",
    "rule": [
        "sl_after_install_spending_limit_gt_zero",
        "sl_after_uninstall_spending_limit_gt_zero",
        "sl_after_set_spending_limit_spending_limit_gt_zero",
        "sl_after_can_enforce_spending_limit_gt_zero",
        "sl_after_enforce_spending_limit_gt_zero"
    ],
    "server": "production",
    "global_timeout": 7200,
    "smt_timeout": 6000,
    "optimistic_loop": true,
    "prover_version": "stellar-oz-changes"
}

