{
    "build_script": "../certora_build.py",
    "loop_iter": 1,
    "msg": "Integrity Rules Spending Limit",
    "rule": [
        "sl_set_spending_limit_integrity",
        "sl_can_enforce_returns_false_if_no_spending_limit_data",
        "sl_can_enforce_returns_false_if_not_contract_call",
        "sl_can_enforce_returns_false_if_not_transfer",
        "sl_can_enforce_returns_true_if_amount_leq_spending_limit",
        "sl_enforce_integrity",
        "sl_install_integrity",
        "sl_uninstall_integrity",
    ],
    "server": "production",
    "global_timeout": 7200,
    "smt_timeout": 6000,
    "optimistic_loop": true,
    "prover_version": "stellar-oz-changes"
}

