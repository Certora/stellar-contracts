{
    "build_script": "../certora_build.py",
    "loop_iter": 1,
    "msg": "Panic Rules Spending Limit",
    "rule": [
        "sl_set_spending_limit_panics_if_invalid_limit",
        "sl_set_spending_limit_panics_if_unauth",
        "sl_set_spending_limit_panics_if_not_installed",
        "sl_install_panics_if_invalid_limit",
        "sl_install_panics_if_unauth",
        "sl_install_panics_if_period_ledgers_is_zero",
        "sl_uninstall_panics_if_unauth"
    ],
    "server": "production",
    "optimistic_loop": true,
    "prover_version": "stellar-oz-changes",
    "global_timeout": 7200,
    "smt_timeout": 6000
}

